<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>جزئیات مطلب | PlayStation News</title>
<style>
:root{--bg:#050d1a;--panel:#0b1930;--line:#1d3b63;--text:#f2f7ff;--muted:#a8bad3}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0%,#102d55 0,transparent 38%),var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif;line-height:1.95}.wrap{width:min(900px,92%);margin:auto}.top{background:#061225;border-bottom:1px solid var(--line);padding:16px 0}.top a{color:#76c8ff;text-decoration:none}.article{margin:25px auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden}.heroimg{width:100%;max-height:480px;object-fit:cover;display:block;background:#10294d}.content{padding:clamp(18px,4vw,34px)}.tag{color:#8bcfff;font-size:13px}.muted{color:var(--muted)}h1{line-height:1.7}.details{white-space:pre-wrap;overflow-wrap:anywhere}.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:20px}.gallery img{width:100%;border:1px solid var(--line);border-radius:12px;cursor:zoom-in}.btn{display:inline-block;background:#087cff;color:#fff!important;border-radius:9px;padding:9px 14px;margin-top:15px}.error{text-align:center;padding:40px;color:var(--muted)}@media(max-width:540px){.gallery{grid-template-columns:1fr}}
</style></head><body><header class="top"><div class="wrap"><a href="index.html">← برگشت به صفحه اصلی</a></div></header><main class="wrap"><article id="article" class="article"><div class="error">در حال بارگذاری مطلب…</div></article></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL="PASTE_SUPABASE_PROJECT_URL_HERE";const SUPABASE_ANON_KEY="PASTE_SUPABASE_ANON_KEY_HERE";const $=id=>document.getElementById(id);function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;", "'":"&#39;"}[c]));}
function safeUrl(s){try{const u=new URL(s);return (u.protocol==='https:'||u.protocol==='http:')?u.href:''}catch{return ''}}
async function start(){const id=new URLSearchParams(location.search).get('id');if(!id){$('article').innerHTML='<div class="error">شناسه مطلب پیدا نشد. <a href="index.html">بازگشت به سایت</a></div>';return}if(SUPABASE_URL.startsWith('PASTE_')||SUPABASE_ANON_KEY.startsWith('PASTE_')){$('article').innerHTML='<div class="error">ابتدا تنظیمات Supabase را در این فایل وارد کن.</div>';return}const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const {data:p,error}=await db.from('posts').select('*').eq('id',id).eq('published',true).maybeSingle();if(error||!p){$('article').innerHTML='<div class="error">این مطلب پیدا نشد یا منتشر نشده است. <p><a href="index.html">بازگشت به صفحه اصلی</a></p></div>';return}const main=safeUrl(p.image_url||'');const gallery=Array.isArray(p.gallery_urls)?p.gallery_urls.map(safeUrl).filter(Boolean):[];const images=[...new Set([main,...gallery].filter(Boolean))];$('article').innerHTML=`${main?`<img class="heroimg" src="${esc(main)}" alt="${esc(p.title)}">`:''}<div class="content"><span class="tag">${esc(p.category||'اخبار')}${p.price?' · '+esc(p.price):''}</span><h1>${esc(p.title)}</h1><p class="muted">${esc(p.summary)}</p>${p.details?`<div class="details">${esc(p.details)}</div>`:''}${images.length>1?`<h2>عکس‌های بیشتر</h2><div class="gallery">${images.slice(1).map(src=>`<a href="${esc(src)}" target="_blank" rel="noopener"><img src="${esc(src)}" alt="عکس مرتبط با ${esc(p.title)}" loading="lazy"></a>`).join('')}</div>`:''}${p.link_url&&safeUrl(p.link_url)?`<p><a class="btn" href="${esc(safeUrl(p.link_url))}" target="_blank" rel="noopener">لینک بیشتر / خرید ↗</a></p>`:''}<p><a href="index.html">← برگشت به همه مطالب</a></p></div>`;document.title=p.title+' | PlayStation News'}start();
</script></body></html>
